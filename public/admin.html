<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Administración | League Tennis Aventura</title>
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>
<body class="admin-page">
  <header class="header admin-header">
    <a class="brand admin-brand" href="/" aria-label="Volver a League Tennis">
      <span class="brand-name">LEAGUE TENNIS <span class="brand-accent">AVENTURA</span></span>
      <span class="brand-sub">CENTRO DE ADMINISTRACIÓN</span>
    </a>
    <div class="admin-header-actions">
      <a class="btn btn-sm btn-secondary" href="/">Ver página pública</a>
      <div id="authButtons"></div>
    </div>
  </header>
  <main class="admin-shell">
    <div class="admin-page-heading">
      <div>
        <span class="eyebrow">GESTIÓN DE LA LIGA</span>
        <h1>Administración</h1>
        <p>Organiza la liga desde un solo lugar. Elige una tarea y sigue las indicaciones en pantalla.</p>
      </div>
      <button class="btn btn-primary" type="button" onclick="showAdminPanel()">Actualizar información</button>
    </div>
    <div id="adminContent" aria-live="polite">
      <div class="admin-loading">Cargando el centro de administración...</div>
    </div>
  </main>
</body>
</html>
