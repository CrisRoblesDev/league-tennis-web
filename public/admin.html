<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Administración | League Tennis Aventura</title>
  <link rel="icon" type="image/png" href="/league-tennis-favicon.png">
  <link rel="stylesheet" href="styles.css?v=11">
  <script src="i18n.js?v=11" defer></script>
  <script src="main.js?v=11" defer></script>
</head>
<body class="admin-page">
  <header class="header admin-header">
    <a class="brand admin-brand" href="/" aria-label="Volver a League Tennis">
      <img class="brand-logo" src="/league-tennis-logo.png" alt="">
      <span class="brand-copy">
        <span class="brand-name">LEAGUE TENNIS <span class="brand-accent">AVENTURA</span></span>
        <span class="brand-sub">CENTRO DE ADMINISTRACIÓN</span>
      </span>
    </a>
    <div class="admin-header-actions">
      <label class="language-picker-wrap">
        <span class="sr-only">Idioma</span>
        <select class="language-picker" aria-label="Idioma">
          <option value="es">Español</option><option value="en">English</option>
          <option value="ru">Русский</option><option value="he">עברית</option>
        </select>
      </label>
      <div id="authButtons"></div>
    </div>
  </header>
  <main class="admin-shell">
    <div class="admin-page-heading">
      <div>
        <span class="eyebrow">GESTIÓN DE LA LIGA</span>
        <h1>Administración</h1>
        <p>Organiza la liga desde un solo lugar. Elige una tarea y sigue las indicaciones en pantalla.</p>
      </div>
      <button class="btn btn-primary" type="button" onclick="showAdminPanel()">Actualizar información</button>
    </div>
    <div id="adminContent" aria-live="polite">
      <div class="admin-loading">Cargando el centro de administración...</div>
    </div>
  </main>
</body>
</html>
